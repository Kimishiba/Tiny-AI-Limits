[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI@^2.5.31
    bblanchon/ArduinoJson@^6.21.3

build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_SCLK=4
    -D TFT_MOSI=6
    -D TFT_MISO=5
    -D TFT_CS=7
    -D TFT_DC=3
    -D TFT_RST=2
    -D TOUCH_CS=1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT7=1
    -D SPI_FREQUENCY=27000000
    -D SPI_TOUCH_FREQUENCY=2500000



