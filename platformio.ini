[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    moononournation/GFX Library for Arduino@^1.4.7
    bblanchon/ArduinoJson@^6.21.3

build_flags =
    -D TFT_WIDTH=360
    -D TFT_HEIGHT=360
    -D TFT_SCLK=18
    -D TFT_MOSI=23
    -D TFT_MISO=19
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=4

