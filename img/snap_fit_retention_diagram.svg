<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>

    <linearGradient id="bezelPcb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="ribGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="960" height="620" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title Badge -->
  <g transform="translate(36, 26)">
    <rect x="0" y="0" width="160" height="24" rx="5" fill="#0284c7"/>
    <text x="80" y="16" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="900" text-anchor="middle" letter-spacing="1">OPTION 2 + OPTION 3</text>
    
    <text x="175" y="18" fill="#ffffff" font-family="'Anybody', sans-serif" font-size="20" font-weight="900" letter-spacing="-0.5">TAPERED FRICTION RIBS & HOUSING CLAMP RETENTION</text>
    <text x="0" y="44" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">100% Solid Bezel • Smooth tapered ribs for drop-in snug fit • Housing rim locks PCB permanently</text>
  </g>

  <!-- LEFT: REAR VIEW OF FRONT BEZEL WITH TAPERED RIBS -->
  <g transform="translate(40, 95)">
    <rect x="0" y="0" width="440" height="495" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="220" y="32" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" text-anchor="middle">VIEW A: REAR OF SOLID FRONT BEZEL (CLEAN POCKET)</text>

    <g transform="translate(220, 260)">
      <!-- Outer Solid Chamfered Plate -->
      <polygon points="-110,-140 110,-140 140,-110 140,110 110,140 -110,140 -140,110 -140,-110" fill="url(#bezelPcb)" stroke="#475569" stroke-width="2"/>
      
      <!-- 4 Corner M3 Mounting Screw Holes -->
      <circle cx="-95" cy="-95" r="9" fill="#090d16" stroke="#94a3b8" stroke-width="1.5"/>
      <circle cx="95" cy="-95" r="9" fill="#090d16" stroke="#94a3b8" stroke-width="1.5"/>
      <circle cx="-95" cy="95" r="9" fill="#090d16" stroke="#94a3b8" stroke-width="1.5"/>
      <circle cx="95" cy="95" r="9" fill="#090d16" stroke="#94a3b8" stroke-width="1.5"/>

      <!-- Circular Screen Pocket Recess (Dia 39.0mm + 0.1mm clearance) -->
      <circle cx="0" cy="-6" r="95" fill="#090d16" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4"/>
      
      <!-- Top Relief Notch (18.0 x 23.0mm) -->
      <path d="M -44 -65 L -44 -122 L 44 -122 L 44 -65" fill="#090d16" stroke="#f59e0b" stroke-width="1.5"/>
      <rect x="-42" y="-120" width="84" height="28" fill="#f59e0b" opacity="0.15"/>
      <text x="0" y="-98" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="900" text-anchor="middle">★ TOP CLEARANCE NOTCH</text>
      <text x="0" y="-85" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="7.5" text-anchor="middle">(18.0mm × 23.0mm)</text>

      <!-- Bottom Connector Tab Recess (24.0 x 26.6mm) -->
      <path d="M -58 50 L -58 125 L 58 125 L 58 50" fill="#090d16" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4"/>

      <!-- Center Optical Viewing Aperture -->
      <circle cx="0" cy="-6" r="77" fill="#1e293b" stroke="#00e5ff" stroke-width="1.5"/>
      <text x="0" y="-3" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">FRONT APERTURE</text>
      <text x="0" y="11" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">Ø33.0mm (SOLID 5.5mm PLATE)</text>

      <!-- 4x SMOOTH TAPERED FRICTION RIBS -->
      <!-- Rib 1: Upper-Right (45 deg) -->
      <g transform="translate(68, -74) rotate(-45)">
        <polygon points="-4,-2 4,-2 2,6 -2,6" fill="url(#ribGrad)" stroke="#ffffff" stroke-width="1" filter="url(#glowCyan)"/>
        <text x="12" y="4" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="800">RIB 1</text>
      </g>

      <!-- Rib 2: Upper-Left (-45 deg) -->
      <g transform="translate(-68, -74) rotate(45)">
        <polygon points="-4,-2 4,-2 2,6 -2,6" fill="url(#ribGrad)" stroke="#ffffff" stroke-width="1" filter="url(#glowCyan)"/>
        <text x="-12" y="4" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="800" text-anchor="end">RIB 2</text>
      </g>

      <!-- Rib 3: Lower-Right (135 deg) -->
      <g transform="translate(72, 60) rotate(-135)">
        <polygon points="-4,-2 4,-2 2,6 -2,6" fill="url(#ribGrad)" stroke="#ffffff" stroke-width="1" filter="url(#glowCyan)"/>
        <text x="12" y="4" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="800">RIB 3</text>
      </g>

      <!-- Rib 4: Lower-Left (-135 deg) -->
      <g transform="translate(-72, 60) rotate(135)">
        <polygon points="-4,-2 4,-2 2,6 -2,6" fill="url(#ribGrad)" stroke="#ffffff" stroke-width="1" filter="url(#glowCyan)"/>
        <text x="-12" y="4" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="800" text-anchor="end">RIB 4</text>
      </g>

      <g transform="translate(0, 150)">
        <text x="0" y="0" fill="#facc15" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="middle">⬇ CONNECTOR HEADER TAB (24.0mm) ⬇</text>
      </g>
    </g>
  </g>

  <!-- RIGHT: FULL ASSEMBLY CLAMPING CROSS-SECTION -->
  <g transform="translate(500, 95)">
    <rect x="0" y="0" width="420" height="495" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="210" y="32" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" text-anchor="middle">VIEW B: DUAL-RETENTION CROSS SECTION</text>

    <g transform="translate(50, 70)">
      <!-- FRONT BEZEL BODY -->
      <path d="M 0 160 L 0 0 L 100 0 L 100 60 L 160 60 L 160 160 Z" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
      <text x="45" y="90" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="middle" transform="rotate(-90 45 90)">FRONT BEZEL</text>

      <!-- Glass Front Lip -->
      <rect x="100" y="60" width="35" height="15" fill="#334155" stroke="#64748b" stroke-width="1"/>
      <text x="117" y="50" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="800" text-anchor="middle">FRONT STOP</text>

      <!-- Screen Glass + PCB -->
      <g transform="translate(135, 75)">
        <rect x="0" y="0" width="130" height="30" rx="2" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="65" y="20" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="900" text-anchor="middle">1.28" LCD GLASS</text>

        <rect x="-10" y="30" width="150" height="22" rx="2" fill="#15803d" stroke="#4ade80" stroke-width="1.5"/>
        <text x="65" y="45" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="900" text-anchor="middle">SCREEN PCB (1.6mm)</text>
      </g>

      <!-- Tapered Friction Rib (Option 3) -->
      <polygon points="100,127 108,127 100,75" fill="#38bdf8" stroke="#0284c7" stroke-width="1" filter="url(#glowCyan)"/>
      <text x="60" y="105" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="800">TAPERED RIB</text>

      <!-- MAIN HOUSING POD CLAMPING RIM (Option 2) -->
      <path d="M 0 160 L 0 320 L 80 320 L 80 200 L 150 200 L 150 160 Z" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
      <text x="45" y="240" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="middle" transform="rotate(-90 45 240)">MAIN HOUSING POD</text>
      
      <!-- Compression Clamping Zone (Green Highlight) -->
      <rect x="125" y="152" width="25" height="12" fill="#10b981" opacity="0.7"/>
      <text x="210" y="162" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="900">⚡ FORWARD CLAMP FORCE</text>

      <!-- Corner M3 Screw Line -->
      <line x1="20" y1="20" x2="20" y2="300" stroke="#facc15" stroke-width="2" stroke-dasharray="4,4"/>
      <text x="25" y="315" fill="#facc15" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="800">M3 CORNER BOLT</text>

      <!-- Feature Callouts -->
      <g transform="translate(160, 200)">
        <rect x="0" y="0" width="165" height="40" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="8" y="16" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="900">1. Option 3 (Friction Ribs):</text>
        <text x="8" y="30" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="7.5">Snug drop-in during assembly</text>

        <rect x="0" y="46" width="165" height="40" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
        <text x="8" y="62" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="900">2. Option 2 (Housing Clamp):</text>
        <text x="8" y="76" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="7.5">Permanent rock-solid compression</text>

        <rect x="0" y="92" width="165" height="40" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="8" y="108" fill="#facc15" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="900">3. 100% Solid Geometry:</text>
        <text x="8" y="122" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="7.5">Flawless, robust 3D print</text>
      </g>
    </g>

    <g transform="translate(20, 440)">
      <rect x="0" y="0" width="380" height="38" rx="6" fill="#182030" stroke="#334155" stroke-width="1"/>
      <text x="190" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="middle">✨ Clean drop-in snug fit + permanent housing compression</text>
    </g>
  </g>
</svg>
