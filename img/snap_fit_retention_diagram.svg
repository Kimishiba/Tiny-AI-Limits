<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>

    <linearGradient id="bezelPcb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="detentGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#10b981" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="960" height="620" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <g opacity="0.12">
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94a3b8"/>
    </pattern>
    <rect width="960" height="620" fill="url(#grid)"/>
  </g>

  <g transform="translate(36, 26)">
    <rect x="0" y="0" width="110" height="24" rx="5" fill="#10b981"/>
    <text x="55" y="16" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="900" text-anchor="middle" letter-spacing="1">APPROACH 1</text>
    
    <text x="125" y="18" fill="#ffffff" font-family="'Anybody', sans-serif" font-size="20" font-weight="900" letter-spacing="-0.5">INTERNAL BLIND SNAP DETENTS (100% SOLID FRONT FACE)</text>
    <text x="0" y="44" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">Zero through-cuts on front faceplate • Molded internal retention beads lock screen securely</text>
  </g>

  <!-- LEFT: REAR VIEW -->
  <g transform="translate(40, 95)">
    <rect x="0" y="0" width="440" height="495" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="220" y="32" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" text-anchor="middle">VIEW A: REAR OF FRONT BEZEL (ZERO FRONT SLOTS)</text>

    <g transform="translate(220, 260)">
      <!-- Outer Solid Chamfered Plate -->
      <polygon points="-110,-140 110,-140 140,-110 140,110 110,140 -110,140 -140,110 -140,-110" fill="url(#bezelPcb)" stroke="#475569" stroke-width="2"/>
      
      <!-- 4 Corner M3 Mounting Screw Holes -->
      <circle cx="-95" cy="-95" r="9" fill="#090d16" stroke="#94a3b8" stroke-width="1.5"/>
      <circle cx="95" cy="-95" r="9" fill="#090d16" stroke="#94a3b8" stroke-width="1.5"/>
      <circle cx="-95" cy="95" r="9" fill="#090d16" stroke="#94a3b8" stroke-width="1.5"/>
      <circle cx="95" cy="95" r="9" fill="#090d16" stroke="#94a3b8" stroke-width="1.5"/>

      <!-- Circular Screen Pocket Recess (Dia 39.0mm) -->
      <circle cx="0" cy="-6" r="95" fill="#090d16" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4"/>
      
      <!-- Top Relief Notch (18x23mm) -->
      <path d="M -44 -65 L -44 -122 L 44 -122 L 44 -65" fill="#090d16" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="0" y="-95" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="800" text-anchor="middle">TOP CLEARANCE NOTCH</text>

      <!-- Bottom Connector Tab Recess (24x26.6mm) -->
      <path d="M -58 50 L -58 125 L 58 125 L 58 50" fill="#090d16" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4"/>

      <!-- Center Optical Viewing Aperture -->
      <circle cx="0" cy="-6" r="77" fill="#1e293b" stroke="#00e5ff" stroke-width="1.5"/>
      <text x="0" y="-3" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">FRONT APERTURE</text>
      <text x="0" y="11" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">Ø33.0mm (SOLID FACE)</text>

      <!-- 4x INTERNAL BLIND SNAP DETENT BEADS (NO THROUGH CUTS) -->
      <!-- Detent 1: Upper-Left -->
      <g transform="translate(-70, -65)">
        <circle cx="0" cy="0" r="6" fill="url(#detentGrad)" stroke="#ffffff" stroke-width="1" filter="url(#glowGreen)"/>
        <text x="-12" y="-5" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="900" text-anchor="end">DETENT 1</text>
      </g>

      <!-- Detent 2: Upper-Right -->
      <g transform="translate(70, -65)">
        <circle cx="0" cy="0" r="6" fill="url(#detentGrad)" stroke="#ffffff" stroke-width="1" filter="url(#glowGreen)"/>
        <text x="12" y="-5" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="900" text-anchor="start">DETENT 2</text>
      </g>

      <!-- Detent 3: Lower-Left -->
      <g transform="translate(-76, 48)">
        <circle cx="0" cy="0" r="6" fill="url(#detentGrad)" stroke="#ffffff" stroke-width="1" filter="url(#glowGreen)"/>
        <text x="-12" y="4" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="900" text-anchor="end">DETENT 3</text>
      </g>

      <!-- Detent 4: Lower-Right -->
      <g transform="translate(76, 48)">
        <circle cx="0" cy="0" r="6" fill="url(#detentGrad)" stroke="#ffffff" stroke-width="1" filter="url(#glowGreen)"/>
        <text x="12" y="4" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="900" text-anchor="start">DETENT 4</text>
      </g>

      <g transform="translate(0, 150)">
        <text x="0" y="0" fill="#facc15" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="middle">⬇ CONNECTOR HEADER TAB (24.0mm) ⬇</text>
      </g>
    </g>
  </g>

  <!-- RIGHT: DETAILED CROSS-SECTION -->
  <g transform="translate(500, 95)">
    <rect x="0" y="0" width="420" height="495" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="210" y="32" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" text-anchor="middle">VIEW B: INTERNAL BLIND DETENT ENGAGEMENT</text>

    <g transform="translate(60, 75)">
      <!-- Bezel Cross Section Body (100% Solid, continuous outer wall) -->
      <path d="M 0 240 L 0 0 L 100 0 L 100 60 L 160 60 L 160 240 Z" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
      <text x="50" y="140" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" text-anchor="middle" transform="rotate(-90 50 140)">100% SOLID FRONT FACE</text>

      <!-- Glass Front Lip (Bottom Stopper) -->
      <rect x="100" y="60" width="35" height="15" fill="#334155" stroke="#64748b" stroke-width="1"/>
      <text x="117" y="50" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="800" text-anchor="middle">FRONT STOP</text>

      <!-- Screen Assembly -->
      <g transform="translate(135, 75)">
        <rect x="0" y="0" width="130" height="30" rx="2" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="65" y="20" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="900" text-anchor="middle">1.28" LCD GLASS</text>

        <rect x="-10" y="30" width="150" height="22" rx="2" fill="#15803d" stroke="#4ade80" stroke-width="1.5"/>
        <text x="65" y="45" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="900" text-anchor="middle">SCREEN PCB (1.6mm)</text>
      </g>

      <!-- Internal Molded Bead Detent (Zero front holes) -->
      <g transform="translate(150, 127)">
        <!-- Bead on pocket wall -->
        <path d="M 0 0 C 8 0, 12 6, 12 12 C 12 18, 8 24, 0 24 Z" fill="url(#detentGrad)" stroke="#ffffff" stroke-width="1.5" filter="url(#glowGreen)"/>
        <text x="24" y="16" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="900">MOLDED BEAD DETENT</text>
      </g>

      <!-- Push Arrow -->
      <g transform="translate(200, 20)">
        <line x1="0" y1="0" x2="0" y2="40" stroke="#00e5ff" stroke-width="3" stroke-linecap="round"/>
        <polygon points="0,48 -5,35 5,35" fill="#00e5ff"/>
        <text x="12" y="26" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="900">PRESS IN</text>
      </g>

      <!-- Feature Callouts -->
      <g transform="translate(185, 155)">
        <rect x="0" y="0" width="150" height="42" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
        <text x="8" y="16" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="900">1. Zero Front Holes:</text>
        <text x="8" y="32" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="8">Cosmetic front is 100% solid</text>

        <rect x="0" y="50" width="150" height="42" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="8" y="66" fill="#facc15" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800">2. Blind Bead Detent:</text>
        <text x="8" y="82" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="8">Smooth click over PCB rim</text>

        <rect x="0" y="100" width="150" height="42" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="8" y="116" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800">3. Top Relief Notch:</text>
        <text x="8" y="132" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="8">Clearance for solder/ribbon</text>
      </g>
    </g>

    <g transform="translate(20, 440)">
      <rect x="0" y="0" width="380" height="38" rx="6" fill="#182030" stroke="#334155" stroke-width="1"/>
      <text x="190" y="24" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="middle">✨ 100% solid pristine front faceplate with internal detents</text>
    </g>
  </g>
</svg>
