<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dotgrid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#dbe4ff"/>
      <circle cx="10" cy="10" r="2.5" fill="#000000" opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="512" height="512" fill="url(#dotgrid2)"/>
  <rect x="4" y="4" width="504" height="504" rx="40" fill="none" stroke="#000000" stroke-width="8"/>

  <!-- Chunky Monitor Shadow -->
  <rect x="116" y="146" width="310" height="220" rx="24" fill="#000000"/>
  <!-- Chunky Monitor Body -->
  <rect x="104" y="134" width="310" height="220" rx="24" fill="#00f0ff" stroke="#000000" stroke-width="6"/>

  <!-- Screen Shadow -->
  <rect x="136" y="166" width="250" height="150" rx="14" fill="#000000"/>
  <!-- Screen Main -->
  <rect x="126" y="156" width="250" height="150" rx="14" fill="#00ff88" stroke="#000000" stroke-width="6"/>

  <!-- AI Face -->
  <text x="256" y="246" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="52" fill="#000000" text-anchor="middle">( • ◡ • )</text>

  <!-- Yellow Pill Sticker -->
  <rect x="76" y="80" width="160" height="54" rx="27" fill="#000000"/>
  <rect x="68" y="72" width="160" height="54" rx="27" fill="#ffe600" stroke="#000000" stroke-width="6"/>
  <text x="148" y="107" font-family="'Outfit', sans-serif" font-weight="900" font-size="22" fill="#000000" text-anchor="middle" letter-spacing="1">TINY AI</text>

  <!-- Hot-Pink Badge -->
  <rect x="330" y="340" width="140" height="60" rx="12" fill="#000000"/>
  <rect x="320" y="330" width="140" height="60" rx="12" fill="#ff3366" stroke="#000000" stroke-width="6"/>
  <text x="390" y="370" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="22" fill="#ffffff" text-anchor="middle">240×240</text>

  <!-- 4-point Sparkle Star -->
  <polygon points="420,80 430,105 455,115 430,125 420,150 410,125 385,115 410,105" fill="#000000"/>
  <polygon points="412,72 422,97 447,107 422,117 412,142 402,117 377,107 402,97" fill="#ffe600" stroke="#000000" stroke-width="5"/>
</svg>