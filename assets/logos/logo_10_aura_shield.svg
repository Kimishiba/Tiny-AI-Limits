<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="outerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#10b981"/>
      <stop offset="100%" stop-color="#00dbe9"/>
    </linearGradient>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10b981" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#00dbe9" flood-opacity="0.6"/>
    </filter>
    <radialGradient id="lockGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#00dbe9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="48" fill="#0a0c10"/>

  <!-- Outer Shield Curved Arcs -->
  <g filter="url(#neonGlow)">
    <path d="M 100 240 A 160 160 0 0 1 412 240" stroke="url(#outerGrad)" stroke-width="20" fill="none" stroke-linecap="round"/>
    <path d="M 412 260 A 160 160 0 0 1 100 260" stroke="url(#outerGrad)" stroke-width="20" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Outer Threshold Scale Markers -->
  <g stroke="#10b981" stroke-width="2.5" opacity="0.8">
    <line x1="256" y1="56" x2="256" y2="76"/>
    <line x1="140" y1="100" x2="152" y2="114"/>
    <line x1="372" y1="100" x2="360" y2="114"/>
    <line x1="256" y1="424" x2="256" y2="444"/>
    <line x1="140" y1="400" x2="152" y2="386"/>
    <line x1="372" y1="400" x2="360" y2="386"/>
  </g>

  <!-- Central 240x240 Display Core -->
  <circle cx="256" cy="250" r="90" fill="#0a0c10" stroke="#1f293d" stroke-width="4"/>
  <circle cx="256" cy="250" r="82" fill="#06090e"/>

  <!-- Core Safeguard Lock Icon -->
  <g filter="url(#neonGlow)">
    <circle cx="256" cy="250" r="40" fill="url(#lockGlow)"/>
    <rect x="236" y="244" width="40" height="32" rx="6" fill="#0a0c10" stroke="#00dbe9" stroke-width="2"/>
    <path d="M246 244 v-14 a10 10 0 0 1 20 0 v14" fill="none" stroke="#00dbe9" stroke-width="4" stroke-linecap="round"/>
    <circle cx="256" cy="260" r="3" fill="#10b981"/>
  </g>

  <text x="256" y="475" text-anchor="middle" font-family="'Outfit', 'Space Grotesk', sans-serif" font-size="34" font-weight="800" fill="#10b981" letter-spacing="3">SENTRY // LIMITS</text>
</svg>