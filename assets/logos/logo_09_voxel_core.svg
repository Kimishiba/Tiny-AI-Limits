<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="monitorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2533" />
      <stop offset="100%" stop-color="#0a0c10" />
    </linearGradient>
    <linearGradient id="pixelGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#00dbe9" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="48" fill="#0a0c10" />

  <!-- Floating Isometric Cube -->
  <g transform="translate(256, 210)" filter="url(#softShadow)">
    <!-- Top Face -->
    <polygon points="0,-100 100,-45 0,10 -100,-45" fill="#242c3d" stroke="#333f57" stroke-width="2"/>
    <!-- Left Face -->
    <polygon points="-100,-45 0,10 0,120 -100,65" fill="#141a24" stroke="#222b3d" stroke-width="2"/>
    <!-- Right Screen Face -->
    <polygon points="0,10 100,-45 100,65 0,120" fill="url(#monitorGradient)" stroke="#222b3d" stroke-width="2"/>

    <!-- Active Pixel Matrix Grid on Right Face -->
    <g transform="translate(15, 20) skewY(-28) scale(0.85)">
      <rect x="0" y="0" width="12" height="12" fill="#10b981" rx="2" filter="url(#glow)"/>
      <rect x="16" y="0" width="12" height="12" fill="#00dbe9" rx="2" filter="url(#glow)"/>
      <rect x="32" y="0" width="12" height="12" fill="#10b981" rx="2" filter="url(#glow)"/>
      <rect x="0" y="16" width="12" height="12" fill="#00dbe9" rx="2" filter="url(#glow)"/>
      <rect x="16" y="16" width="12" height="12" fill="#ffffff" rx="2" filter="url(#glow)"/>
      <rect x="32" y="16" width="12" height="12" fill="#00dbe9" rx="2" filter="url(#glow)"/>
      <rect x="0" y="32" width="12" height="12" fill="#10b981" rx="2" filter="url(#glow)"/>
      <rect x="16" y="32" width="12" height="12" fill="#00dbe9" rx="2" filter="url(#glow)"/>
      <rect x="32" y="32" width="12" height="12" fill="#10b981" rx="2" filter="url(#glow)"/>
    </g>

    <!-- Detached Floating Voxels -->
    <rect x="-120" y="-80" width="10" height="10" rx="2" fill="#10b981" filter="url(#glow)"/>
    <rect x="110" y="-70" width="8" height="8" rx="2" fill="#00dbe9" filter="url(#glow)"/>
    <rect x="120" y="20" width="12" height="12" rx="2" fill="#10b981" filter="url(#glow)"/>
  </g>

  <text x="256" y="415" font-family="'Outfit', 'Space Grotesk', sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">TINY VOXEL</text>
  <text x="256" y="450" font-family="'JetBrains Mono', monospace" font-size="14" fill="#00dbe9" text-anchor="middle" letter-spacing="3">PIXEL COMPANION // AI</text>
</svg>