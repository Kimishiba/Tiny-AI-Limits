<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="screenClipStand">
      <rect x="108" y="98" width="296" height="232" rx="24" ry="24" />
    </clipPath>
  </defs>

  <!-- Clean Pure White Background -->
  <rect width="512" height="512" fill="#ffffff" />

  <!-- DESKTOP PEDESTAL BASE (HARD SHADOW) -->
  <rect x="176" y="416" width="176" height="22" fill="#000000" rx="0" />
  <!-- DESKTOP PEDESTAL BASE (MAIN) -->
  <rect x="168" y="408" width="176" height="22" fill="#000000" stroke="#000000" stroke-width="4" rx="0" />
  <!-- STAND NECK: Vibrant Orange (#ff5f1f) -->
  <rect x="232" y="356" width="48" height="54" fill="#ff5f1f" stroke="#000000" stroke-width="5" rx="0" />

  <!-- MONITOR CHASSIS HARD SHADOW (+8px, +8px, 0px blur) -->
  <rect x="92" y="82" width="344" height="280" fill="#000000" rx="32" ry="32" />
  <!-- MONITOR CHASSIS: Pure White (#ffffff) with 5px Solid Black Border & Round Corners -->
  <rect x="84" y="74" width="344" height="280" fill="#ffffff" stroke="#000000" stroke-width="5" rx="32" ry="32" />

  <!-- SCREEN VIEWPORT CONTAINER: Vibrant Orange (#ff5f1f) with 4px Black Border & Round Corners -->
  <rect x="108" y="98" width="296" height="232" fill="#ff5f1f" stroke="#000000" stroke-width="4" rx="24" ry="24" />

  <!-- CLIPPED SCREEN CONTENT -->
  <g clip-path="url(#screenClipStand)">
    <!-- SCREEN HEADER DIVIDER (4px Solid Black) -->
    <line x1="108" y1="138" x2="404" y2="138" stroke="#000000" stroke-width="4" />
    <!-- Status Micro-Chips in Screen Header -->
    <rect x="128" y="117" width="12" height="12" fill="#000000" rx="0" />
    <rect x="146" y="117" width="12" height="12" fill="#000000" rx="0" />
    <text x="384" y="128" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#000000" text-anchor="end">SYS: LIVE</text>

    <!-- GEOMETRIC AI NEURAL SPARK -->
    <polygon points="262,166 280,210 324,226 280,242 262,286 244,242 200,226 244,210" fill="#000000" />
    <polygon points="256,160 274,204 318,220 274,236 256,280 238,236 194,220 238,204" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linejoin="miter" />
    <!-- Center Core Square (Vibrant Orange) -->
    <rect x="249" y="213" width="14" height="14" fill="#ff5f1f" stroke="#000000" stroke-width="3" rx="0" />

    <!-- SEGMENTED QUOTA TELEMETRY BAR: [ ■■■■■■■□ 94% ] -->
    <g transform="translate(126, 286)">
      <rect x="4" y="4" width="260" height="28" fill="#000000" rx="0" />
      <rect x="0" y="0" width="260" height="28" fill="#ffffff" stroke="#000000" stroke-width="4" rx="0" />
      <!-- 7 Active Segments (Solid Black) -->
      <rect x="8" y="6" width="20" height="16" fill="#000000" rx="0" />
      <rect x="32" y="6" width="20" height="16" fill="#000000" rx="0" />
      <rect x="56" y="6" width="20" height="16" fill="#000000" rx="0" />
      <rect x="80" y="6" width="20" height="16" fill="#000000" rx="0" />
      <rect x="104" y="6" width="20" height="16" fill="#000000" rx="0" />
      <rect x="128" y="6" width="20" height="16" fill="#000000" rx="0" />
      <rect x="152" y="6" width="20" height="16" fill="#000000" rx="0" />
      <!-- 1 Inactive Segment (Hollow) -->
      <rect x="176" y="6" width="20" height="16" fill="none" stroke="#000000" stroke-width="3" rx="0" />
      <!-- Telemetry Readout -->
      <text x="248" y="19" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="12" fill="#000000" text-anchor="end">94%</text>
    </g>
  </g>
</svg>