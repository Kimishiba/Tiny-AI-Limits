<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#3b82f6"/>
      <stop offset="50%"  stop-color="#00dbe9"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="48" fill="#0a0c10"/>

  <path d="M256,140 C 110,140 110,360 256,360 S 402,360 256,140" fill="none" stroke="url(#gradRibbon)" stroke-width="32" stroke-linecap="round"/>

  <!-- Telemetry notches -->
  <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round">
    <line x1="176" y1="210" x2="176" y2="228"/>
    <line x1="144" y1="250" x2="162" y2="250"/>
    <line x1="176" y1="290" x2="176" y2="308"/>
    <line x1="336" y1="210" x2="336" y2="228"/>
    <line x1="368" y1="250" x2="350" y2="250"/>
    <line x1="336" y1="290" x2="336" y2="308"/>
  </g>

  <!-- Central glowing node -->
  <circle cx="256" cy="250" r="14" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="256" cy="250" r="6" fill="#00dbe9"/>

  <text x="256" y="425" text-anchor="middle" fill="#ffffff" font-family="'Outfit', 'Space Grotesk', sans-serif" font-size="42" font-weight="800" letter-spacing="3">TINY AI</text>
  <text x="256" y="465" text-anchor="middle" fill="#00dbe9" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="600" letter-spacing="4">LIMITS // STREAM</text>
</svg>