<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="monitorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1e26"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <radialGradient id="eyeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="70%" stop-color="#00dbe9"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </radialGradient>
    <radialGradient id="irisGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00dbe9"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="chassisShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="antennaGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="48" fill="#0a0c10"/>

  <rect x="96" y="120" width="320" height="240" rx="48" ry="48" fill="url(#monitorGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="2" filter="url(#chassisShadow)"/>
  <rect x="236" y="360" width="40" height="60" rx="8" ry="8" fill="#1c1e26"/>
  <rect x="206" y="415" width="100" height="12" rx="6" fill="#161b24"/>

  <line x1="256" y1="120" x2="256" y2="80" stroke="#10b981" stroke-width="4" filter="url(#antennaGlow)"/>
  <circle cx="256" cy="80" r="10" fill="#10b981" filter="url(#antennaGlow)"/>

  <circle cx="256" cy="240" r="80" fill="url(#eyeGrad)" filter="url(#glow)"/>
  <circle cx="256" cy="240" r="40" fill="url(#irisGrad)"/>
  <circle cx="256" cy="240" r="14" fill="#ffffff"/>

  <g stroke="#10b981" stroke-width="2" fill="none" opacity="0.6">
    <circle cx="256" cy="240" r="52"/>
    <circle cx="256" cy="240" r="64"/>
    <circle cx="256" cy="240" r="76"/>
  </g>

  <path d="M200 200 A60 60 0 0 1 312 200" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6" fill="none" stroke-linecap="round"/>

  <text x="256" y="465" font-family="'Outfit', 'Space Grotesk', sans-serif" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" letter-spacing="2">TINY AI</text>
</svg>