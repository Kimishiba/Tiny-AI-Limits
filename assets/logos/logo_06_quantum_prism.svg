<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="caseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#1e2433"/>
    </linearGradient>
    <radialGradient id="prismGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#00dbe9" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </radialGradient>
    <filter id="caseShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="48" fill="#0a0c10"/>

  <g filter="url(#caseShadow)">
    <polygon points="410,166 410,346 256,436 102,346 102,166 256,76" fill="url(#caseGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  </g>

  <!-- Central Quantum Prism Screen -->
  <polygon points="318,220 318,290 256,326 194,290 194,220 256,184" fill="url(#prismGrad)" stroke="#0a0c10" stroke-width="2" filter="url(#glow)"/>

  <!-- Refractive Laser Beams -->
  <g stroke-width="3.5" stroke-linecap="round" filter="url(#glow)">
    <line x1="256" y1="255" x2="350" y2="120" stroke="#10b981" />
    <line x1="256" y1="255" x2="162" y2="120" stroke="#00dbe9" />
    <line x1="256" y1="255" x2="256" y2="390" stroke="#3b82f6" />
  </g>

  <!-- Metric Threshold Marks -->
  <g stroke="#10b981" stroke-width="2" opacity="0.6">
    <line x1="310" y1="120" x2="310" y2="136"/>
    <line x1="256" y1="90"  x2="256" y2="106"/>
    <line x1="202" y1="120" x2="202" y2="136"/>
    <line x1="380" y1="300" x2="365" y2="300"/>
    <line x1="132" y1="300" x2="147" y2="300"/>
  </g>

  <text x="256" y="475" text-anchor="middle" fill="#ffffff" font-family="'Outfit', 'Space Grotesk', sans-serif" font-size="34" font-weight="800" letter-spacing="3">HEX // PRISM.AI</text>
</svg>