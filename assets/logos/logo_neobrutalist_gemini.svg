<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="screenClip">
      <rect x="86" y="86" width="340" height="340" rx="28" ry="28" />
    </clipPath>
  </defs>

  <!-- Clean Pure White Canvas -->
  <rect width="512" height="512" fill="#ffffff" />

  <!-- MONITOR CHASSIS HARD SHADOW (+10px, +10px, 0px blur) -->
  <rect x="74" y="74" width="380" height="380" fill="#000000" rx="36" ry="36" />
  <!-- MONITOR CHASSIS: Pure White (#ffffff) with 6px Solid Black Border & Round Corners -->
  <rect x="64" y="64" width="380" height="380" fill="#ffffff" stroke="#000000" stroke-width="6" rx="36" ry="36" />

  <!-- SCREEN VIEWPORT CONTAINER: Vibrant Orange (#ff5f1f) with 5px Black Border -->
  <rect x="86" y="86" width="340" height="340" fill="#ff5f1f" stroke="#000000" stroke-width="5" rx="28" ry="28" />

  <!-- CLIPPED SCREEN CONTENT -->
  <g clip-path="url(#screenClip)">
    <!-- SCREEN HEADER DIVIDER (4px Solid Black) -->
    <line x1="86" y1="136" x2="426" y2="136" stroke="#000000" stroke-width="4" />
    <!-- Status Micro-Chips in Screen Header -->
    <rect x="110" y="110" width="14" height="14" fill="#000000" rx="0" />
    <rect x="132" y="110" width="14" height="14" fill="#000000" rx="0" />
    <text x="402" y="123" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" fill="#000000" text-anchor="end">SYS: LIVE</text>

    <!-- GEOMETRIC AI NEURAL SPARK (Centered) -->
    <polygon points="264,166 286,218 338,236 286,254 264,306 242,254 190,236 242,218" fill="#000000" />
    <polygon points="256,158 278,210 330,228 278,246 256,298 234,246 182,228 234,210" fill="#ffffff" stroke="#000000" stroke-width="5" stroke-linejoin="miter" />
    <!-- Center Core Square (Vibrant Orange) -->
    <rect x="247" y="219" width="18" height="18" fill="#ff5f1f" stroke="#000000" stroke-width="4" rx="0" />

    <!-- SEGMENTED QUOTA TELEMETRY BAR: [ ■■■■■■■□ 94% ] -->
    <g transform="translate(108, 350)">
      <rect x="5" y="5" width="296" height="34" fill="#000000" rx="0" />
      <rect x="0" y="0" width="296" height="34" fill="#ffffff" stroke="#000000" stroke-width="4" rx="0" />
      <!-- 7 Active Segments (Solid Black) -->
      <rect x="10" y="7" width="24" height="20" fill="#000000" rx="0" />
      <rect x="38" y="7" width="24" height="20" fill="#000000" rx="0" />
      <rect x="66" y="7" width="24" height="20" fill="#000000" rx="0" />
      <rect x="94" y="7" width="24" height="20" fill="#000000" rx="0" />
      <rect x="122" y="7" width="24" height="20" fill="#000000" rx="0" />
      <rect x="150" y="7" width="24" height="20" fill="#000000" rx="0" />
      <rect x="178" y="7" width="24" height="20" fill="#000000" rx="0" />
      <!-- 1 Inactive Segment (Hollow) -->
      <rect x="206" y="7" width="24" height="20" fill="none" stroke="#000000" stroke-width="3" rx="0" />
      <!-- Telemetry Readout -->
      <text x="282" y="23" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="14" fill="#000000" text-anchor="end">94%</text>
    </g>
  </g>
</svg>