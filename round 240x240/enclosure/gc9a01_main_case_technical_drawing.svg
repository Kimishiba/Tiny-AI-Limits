        <rect x="762.0" y="616.8" width="19.0" height="106.39999999999999" fill="#0f172a" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,2" rx="2" />
        <rect x="819.0" y="616.8" width="19.0" height="106.39999999999999" fill="#0f172a" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,2" rx="2" />
        <text x="800" y="666" text-anchor="middle" fill="#22c55e" font-size="10" font-weight="700">BOTTOM PIN TRENCHES</text>

        <!-- 4 Corner Screw Blind Pilot Holes -->
    

                <circle cx="731.6" cy="601.6" r="3.8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" />
                <line x1="725.6" y1="601.6" x2="737.6" y2="601.6" stroke="#fbbf24" stroke-width="0.8" />
                <line x1="731.6" y1="595.6" x2="731.6" y2="607.6" stroke="#fbbf24" stroke-width="0.8" />
            

                <circle cx="731.6" cy="738.4" r="3.8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" />
                <line x1="725.6" y1="738.4" x2="737.6" y2="738.4" stroke="#fbbf24" stroke-width="0.8" />
                <line x1="731.6" y1="732.4" x2="731.6" y2="744.4" stroke="#fbbf24" stroke-width="0.8" />
            

                <circle cx="868.4" cy="601.6" r="3.8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" />
                <line x1="862.4" y1="601.6" x2="874.4" y2="601.6" stroke="#fbbf24" stroke-width="0.8" />
                <line x1="868.4" y1="595.6" x2="868.4" y2="607.6" stroke="#fbbf24" stroke-width="0.8" />
            

                <circle cx="868.4" cy="738.4" r="3.8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" />
                <line x1="862.4" y1="738.4" x2="874.4" y2="738.4" stroke="#fbbf24" stroke-width="0.8" />
                <line x1="868.4" y1="732.4" x2="868.4" y2="744.4" stroke="#fbbf24" stroke-width="0.8" />
            
</g>

    <g transform="translate(40, 800)">
        <rect x="0" y="0" width="1120" height="65" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="6" />
        <text x="20" y="24" fill="#22c55e" font-size="13" font-weight="700">UPDATED PIN HEADER &amp; SOLDER TAIL FIT SPECIFICATIONS:</text>
        <text x="20" y="48" fill="#cbd5e1" font-size="12" font-weight="500">
            • Display Pin Notch: 24.0 x 8.0mm top pass-through &nbsp;&nbsp;|&nbsp;&nbsp; 
            • ESP32 Solder Relief: 2x 5.0mm trenches + 2.0mm corner standoff ledges &nbsp;&nbsp;|&nbsp;&nbsp; 
            • Expanded Housing Depth: 24.0mm total
        </text>
        <text x="1100" y="38" text-anchor="end" fill="#fbbf24" font-size="13" font-weight="700">DESIGN READY FOR SOLDERED HEADER PINS &amp; HARNESS</text>
