    <g id="view4">
        <text x="800" y="520" text-anchor="middle" fill="#38bdf8" font-size="15" font-weight="700">VIEW 4: REAR HOUSING ELEVATION &amp; PIN TRENCHES</text>

        <line x1="670" y1="670" x2="930" y2="670" stroke="#0284c7" stroke-width="1" stroke-dasharray="8,4,2,4" />
        <line x1="800" y1="540" x2="800" y2="800" stroke="#0284c7" stroke-width="1" stroke-dasharray="8,4,2,4" />

        <!-- Outer Octagonal Profile (48mm x 48mm) -->
