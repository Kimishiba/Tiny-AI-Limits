<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" width="100%" height="100%">
  <defs>
    <!-- Gradients & Shadows -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14171f"/>
      <stop offset="100%" stop-color="#0d0f14"/>
    </linearGradient>
    
    <linearGradient id="espPcb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="oledPcb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <linearGradient id="goldPin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="940" height="600" rx="16" fill="url(#bgGrad)" stroke="#262b36" stroke-width="2"/>
  
  <!-- Subtle Grid Dots Pattern -->
  <g opacity="0.15">
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94a3b8"/>
    </pattern>
    <rect width="940" height="600" fill="url(#grid)"/>
  </g>

  <!-- Title & Header Badge -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="125" height="26" rx="6" fill="#10b981" filter="url(#shadow)"/>
    <text x="62" y="17" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1">I2C BUS (4-PIN)</text>
    
    <text x="140" y="19" fill="#ffffff" font-family="'Anybody', sans-serif" font-size="20" font-weight="900" letter-spacing="-0.5">SSD1306 0.96" / 1.3" OLED → ESP32-C3 SUPERMINI</text>
    <text x="0" y="44" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">Ultra-simple 4-wire standard hardware I2C wiring (Address: 0x3C)</text>
  </g>

  <!-- ======================================================== -->
  <!-- 1. ESP32-C3 SUPERMINI BOARD (LEFT SIDE)                  -->
  <!-- ======================================================== -->
  <g transform="translate(50, 105)" filter="url(#shadow)">
    <!-- Board PCB (SuperMini Characteristic Deep Violet/Black PCB) -->
    <rect x="0" y="0" width="205" height="430" rx="14" fill="url(#espPcb)" stroke="#4f46e5" stroke-width="2.5"/>

    <!-- Gold Board Edge Castellation Guides -->
    <rect x="-3" y="10" width="6" height="410" fill="#ca8a04" opacity="0.3"/>
    <rect x="202" y="10" width="6" height="410" fill="#ca8a04" opacity="0.3"/>

    <!-- Silk Branding Header -->
    <rect x="22" y="52" width="161" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="102" y="70" fill="#ffffff" font-family="'Anybody', sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="0.5">ESP32-C3</text>
    <text x="102" y="85" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" text-anchor="middle">SUPERMINI • 22.5×18mm</text>

    <!-- USB-C Receptacle (Top Center) -->
    <rect x="65" y="-14" width="75" height="30" rx="7" fill="url(#metal)" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="77" y="-6" width="51" height="14" rx="4" fill="#020617"/>
    <text x="102" y="4" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">TYPE-C USB</text>

    <!-- SoC Chip (Center) -->
    <rect x="52" y="185" width="100" height="100" rx="6" fill="#090d16" stroke="#334155" stroke-width="1.5"/>
    <rect x="59" y="192" width="86" height="86" rx="4" fill="#121826"/>
    <!-- Chip Markings -->
    <circle cx="69" cy="202" r="2.5" fill="#ca8a04"/>
    <text x="102" y="231" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="middle">ESPRESSIF</text>
    <text x="102" y="245" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">ESP32-C3FN4</text>
    <text x="102" y="259" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">RISC-V • WiFi+BLE</text>

    <!-- Ceramic 3D Antenna & Status LED -->
    <rect x="42" y="112" width="45" height="24" rx="3" fill="#ca8a04" stroke="#78350f" stroke-width="1"/>
    <text x="64" y="127" fill="#451a03" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="900" text-anchor="middle">ANTENNA</text>
    
    <circle cx="158" cy="124" r="3.5" fill="#10b981" filter="url(#shadow)"/>
    <text x="158" y="112" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="800" text-anchor="middle">PWR LED</text>

    <!-- Tactile SMD Buttons -->
    <rect x="28" y="325" width="22" height="26" rx="4" fill="#1e293b" stroke="#475569"/>
    <circle cx="39" cy="338" r="5" fill="#e2e8f0"/>
    <text x="39" y="362" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="800" text-anchor="middle">BOOT</text>

    <rect x="155" y="325" width="22" height="26" rx="4" fill="#1e293b" stroke="#475569"/>
    <circle cx="166" cy="338" r="5" fill="#e2e8f0"/>
    <text x="166" y="362" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="800" text-anchor="middle">RESET</text>

    <!-- ==================== LEFT HEADER PINS ==================== -->
    <!-- Pin 1: 5V -->
    <circle cx="16" cy="40" r="7.5" fill="url(#goldPin)"/>
    <text x="30" y="44" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">5V [1]</text>

    <!-- Pin 2: GND (Connected) -->
    <circle id="pin_esp_gnd2" cx="16" cy="80" r="7.5" fill="#000000" stroke="#94a3b8" stroke-width="2.5"/>
    <text x="30" y="84" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800">GND [2]</text>

    <!-- Pin 3: 3V3 (Connected) -->
    <circle id="pin_esp_3v3_2" cx="16" cy="120" r="7.5" fill="#ef4444" stroke="#ffffff" stroke-width="2.5"/>
    <text x="30" y="124" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800">3V3 [3]</text>

    <!-- Pin 4: GPIO 0 -->
    <circle cx="16" cy="160" r="7.5" fill="url(#goldPin)"/>
    <text x="30" y="164" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">IO0 [4]</text>

    <!-- Pin 5: GPIO 1 -->
    <circle cx="16" cy="200" r="7.5" fill="url(#goldPin)"/>
    <text x="30" y="204" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">IO1 [5]</text>

    <!-- Pin 6: GPIO 2 -->
    <circle cx="16" cy="240" r="7.5" fill="url(#goldPin)"/>
    <text x="30" y="244" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">IO2 [6]</text>

    <!-- Pin 7: GPIO 3 -->
    <circle cx="16" cy="280" r="7.5" fill="url(#goldPin)"/>
    <text x="30" y="284" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">IO3 [7]</text>

    <!-- Pin 8: GPIO 4 -->
    <circle cx="16" cy="320" r="7.5" fill="url(#goldPin)"/>
    <text x="30" y="324" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">IO4 [8]</text>

    <!-- Pin 9: GPIO 5 -->
    <circle cx="16" cy="360" r="7.5" fill="url(#goldPin)"/>
    <text x="30" y="364" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">IO5 [9]</text>

    <!-- ==================== RIGHT HEADER PINS ==================== -->
    <!-- Pin 16: GPIO 6 -->
    <circle cx="189" cy="40" r="7.5" fill="url(#goldPin)"/>
    <text x="175" y="44" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="end">IO6 [16]</text>

    <!-- Pin 15: GPIO 7 -->
    <circle cx="189" cy="80" r="7.5" fill="url(#goldPin)"/>
    <text x="175" y="84" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="end">IO7 [15]</text>

    <!-- Pin 14: GPIO 8 (I2C SDA) -->
    <circle id="pin_esp_sda" cx="189" cy="120" r="7.5" fill="#06b6d4" stroke="#ffffff" stroke-width="2.5"/>
    <text x="175" y="124" fill="#22d3ee" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="end">IO8 (SDA) [14]</text>

    <!-- Pin 13: GPIO 9 (I2C SCL) -->
    <circle id="pin_esp_scl" cx="189" cy="160" r="7.5" fill="#eab308" stroke="#ffffff" stroke-width="2.5"/>
    <text x="175" y="164" fill="#facc15" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="end">IO9 (SCL) [13]</text>


    <!-- Pin 12: GPIO 10 -->
    <circle cx="175" cy="200" r="7" fill="url(#goldPin)"/>
    <text x="162" y="204" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="end">IO10 [12]</text>

    <!-- Pin 11: GPIO 20 (RX) -->
    <circle cx="175" cy="240" r="7" fill="url(#goldPin)"/>
    <text x="162" y="244" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="end">IO20 [11]</text>

    <!-- Pin 10: GPIO 21 (TX) -->
    <circle cx="175" cy="280" r="7" fill="url(#goldPin)"/>
    <text x="162" y="284" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="end">IO21 [10]</text>

    <!-- Pin 9 (Right GND) -->
    <circle cx="175" cy="320" r="7" fill="url(#goldPin)"/>
    <text x="162" y="324" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="end">GND [9]</text>

    <!-- Pin 8 (Right 5V) -->
    <circle cx="175" cy="360" r="7" fill="url(#goldPin)"/>
    <text x="162" y="364" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="end">5V [8]</text>
  </g>

  <!-- ======================================================== -->
  <!-- 2. SSD1306 0.96" OLED MODULE (RIGHT SIDE)                -->
  <!-- ======================================================== -->
  <g transform="translate(560, 140)" filter="url(#shadow)">
    <!-- OLED Module PCB -->
    <rect x="0" y="0" width="280" height="280" rx="10" fill="url(#oledPcb)" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="15" cy="15" r="5" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <circle cx="265" cy="15" r="5" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <circle cx="15" cy="265" r="5" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <circle cx="265" cy="265" r="5" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>

    <!-- 4-Pin Top Header -->
    <rect x="50" y="-14" width="180" height="28" rx="5" fill="#181c24" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Pin 1: GND -->
    <g transform="translate(75, 0)">
      <circle cx="0" cy="0" r="7" fill="#000000" stroke="#94a3b8" stroke-width="2"/>
      <text x="0" y="24" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="middle">GND</text>
    </g>

    <!-- Pin 2: VCC -->
    <g transform="translate(118, 0)">
      <circle cx="0" cy="0" r="7" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="24" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="middle">VCC</text>
    </g>

    <!-- Pin 3: SCL -->
    <g transform="translate(162, 0)">
      <circle cx="0" cy="0" r="7" fill="#eab308" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="24" fill="#facc15" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="middle">SCL</text>
    </g>

    <!-- Pin 4: SDA -->
    <g transform="translate(205, 0)">
      <circle cx="0" cy="0" r="7" fill="#06b6d4" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="24" fill="#22d3ee" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="middle">SDA</text>
    </g>

    <!-- OLED Glass Screen Area -->
    <rect x="25" y="55" width="230" height="195" rx="6" fill="#000000" stroke="#1e293b" stroke-width="2"/>

    <!-- Robot Companion Animated Eyes Display Mock -->
    <!-- Eye Left -->
    <rect x="55" y="115" width="65" height="75" rx="16" fill="#38bdf8"/>
    <!-- Eye Right -->
    <rect x="160" y="115" width="65" height="75" rx="16" fill="#38bdf8"/>

    <text x="140" y="90" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="middle">SSD1306 128x64 I2C</text>
    <text x="140" y="225" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">ROBOT EYES ENGINE</text>
  </g>

  <!-- ======================================================== -->
  <!-- 3. COLOR-CODED JUMPER WIRES (CURVED BEZIERS)             -->
  <!-- ======================================================== -->
  <!-- Wire 1: GND (BLACK/SLATE) -> ESP Pin 2 [75, 190] to OLED GND [635, 140] -->
  <path d="M 75 190 C 150 140, 480 80, 635 140" fill="none" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
  <path d="M 75 190 C 150 140, 480 80, 635 140" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>

  <!-- Wire 2: 3.3V VCC (RED) -> ESP Pin 3 [75, 230] to OLED VCC [678, 140] -->
  <path d="M 75 230 C 180 200, 520 100, 678 140" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round" opacity="0.95"/>

  <!-- Wire 3: I2C SCL (YELLOW) -> ESP Pin 13 [235, 270] to OLED SCL [722, 140] -->
  <path d="M 235 270 C 380 300, 580 180, 722 140" fill="none" stroke="#eab308" stroke-width="4" stroke-linecap="round" opacity="0.95"/>

  <!-- Wire 4: I2C SDA (CYAN) -> ESP Pin 14 [235, 230] to OLED SDA [765, 140] -->
  <path d="M 235 230 C 400 240, 620 180, 765 140" fill="none" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" opacity="0.95"/>

  <!-- ======================================================== -->
  <!-- 4. QUICK REFERENCE PINOUT SUMMARY TABLE (BOTTOM)         -->
  <!-- ======================================================== -->
  <g transform="translate(60, 500)">
    <!-- Summary Box -->
    <rect x="0" y="0" width="820" height="70" rx="10" fill="#181c24" stroke="#334155" stroke-width="1.5"/>
    
    <text x="20" y="28" fill="#ffffff" font-family="'Anybody', sans-serif" font-size="12" font-weight="900">STANDARD 4-PIN I2C PINOUT:</text>
    <text x="20" y="52" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Default hardware I2C wire connections on ESP32-C3 SuperMini</text>

    <text x="320" y="38" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">● Pin 2 (GND) → GND</text>
    <text x="490" y="38" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">● Pin 3 (3V3) → VCC</text>
    <text x="640" y="38" fill="#facc15" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">● Pin 13 (IO9) → SCL</text>
    <text x="640" y="56" fill="#22d3ee" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">● Pin 14 (IO8) → SDA</text>
  </g>
</svg>
