<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>

    <linearGradient id="beamGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="960" height="620" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <g transform="translate(36, 26)">
    <rect x="0" y="0" width="150" height="24" rx="5" fill="#f43f5e"/>
    <text x="75" y="16" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="900" text-anchor="middle" letter-spacing="1">PROPER COMPLIANCE</text>
    
    <text x="165" y="18" fill="#ffffff" font-family="'Anybody', sans-serif" font-size="20" font-weight="900" letter-spacing="-0.5">ISOLATED CANTILEVER SPRING MECHANICS</text>
    <text x="0" y="44" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">Side relief slits + Top clearance gap completely isolate the spring beam for effortless bending</text>
  </g>

  <!-- LEFT: 3D-ISOMETRIC STYLE KINEMATICS VIEW -->
  <g transform="translate(40, 95)">
    <rect x="0" y="0" width="440" height="495" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="220" y="32" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" text-anchor="middle">VIEW A: 3-SIDED ISOLATION (U-SLOT CUT)</text>

    <g transform="translate(50, 70)">
      <!-- Surrounding Bezel Wall (Dark Grey) -->
      <path d="M 0 0 L 340 0 L 340 360 L 0 360 Z" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>

      <!-- U-Shaped Isolation Trench (Pink/Red Void) -->
      <!-- Left slit (1.2mm wide) -->
      <rect x="110" y="70" width="15" height="220" rx="3" fill="#050811" stroke="#f43f5e" stroke-width="1.5"/>
      <!-- Right slit (1.2mm wide) -->
      <rect x="215" y="70" width="15" height="220" rx="3" fill="#050811" stroke="#f43f5e" stroke-width="1.5"/>
      <!-- Top clearance gap (1.5mm wide) -->
      <rect x="110" y="70" width="120" height="18" rx="3" fill="#050811" stroke="#f43f5e" stroke-width="1.5"/>

      <!-- The Fully Isolated Cantilever Spring Beam (Cyan) -->
      <rect x="130" y="94" width="80" height="196" rx="4" fill="url(#beamGrad)" stroke="#ffffff" stroke-width="1.5" filter="url(#glowCyan)"/>
      <text x="170" y="190" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="900" text-anchor="middle">SPRING</text>
      <text x="170" y="210" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="900" text-anchor="middle">BEAM</text>

      <!-- Retention Tooth with Ramp on Free End (Top) -->
      <polygon points="135,120 205,120 170,95" fill="#fde047" stroke="#ca8a04" stroke-width="1.5"/>
      <text x="170" y="145" fill="#fde047" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="900" text-anchor="middle">SNAP TOOTH</text>

      <!-- Root Hinge / Anchor at Bottom -->
      <rect x="125" y="285" width="90" height="10" fill="#10b981" opacity="0.4"/>
      <text x="170" y="320" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="900" text-anchor="middle">ROOT ANCHOR (BOTTOM)</text>

      <!-- Dimension Labels -->
      <text x="55" y="180" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800">LEFT SLIT</text>
      <text x="240" y="180" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800">RIGHT SLIT</text>
      <text x="170" y="55" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="900" text-anchor="middle">★ TOP CLEARANCE GAP ★</text>
    </g>
  </g>

  <!-- RIGHT: SIDE CROSS-SECTION & DEFLECTION MECHANICS -->
  <g transform="translate(500, 95)">
    <rect x="0" y="0" width="420" height="495" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="210" y="32" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" text-anchor="middle">VIEW B: CROSS SECTION WITH TOP GAP</text>

    <g transform="translate(60, 75)">
      <!-- Bezel Body -->
      <path d="M 0 240 L 0 0 L 100 0 L 100 60 L 160 60 L 160 240 Z" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
      <text x="50" y="140" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" text-anchor="middle" transform="rotate(-90 50 140)">SOLID FRONT FACE</text>

      <!-- Glass Front Lip -->
      <rect x="100" y="60" width="35" height="15" fill="#334155" stroke="#64748b" stroke-width="1"/>
      <text x="117" y="50" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="800" text-anchor="middle">FRONT STOP</text>

      <!-- Screen PCB -->
      <g transform="translate(135, 75)">
        <rect x="0" y="0" width="130" height="30" rx="2" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="65" y="20" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="900" text-anchor="middle">1.28" LCD GLASS</text>

        <rect x="-10" y="30" width="150" height="22" rx="2" fill="#15803d" stroke="#4ade80" stroke-width="1.5"/>
        <text x="65" y="45" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="900" text-anchor="middle">SCREEN PCB (1.6mm)</text>
      </g>

      <!-- TOP CLEARANCE GAP (Allows tip of beam to swing freely!) -->
      <rect x="95" y="110" width="35" height="18" fill="#f43f5e" opacity="0.3"/>
      <text x="145" y="123" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="900">TOP GAP (FREE TIP)</text>

      <!-- Isolated Cantilever Spring Arm -->
      <g transform="translate(100, 130)">
        <path d="M 0 0 L 22 0 L 22 90 L 0 90 Z" fill="url(#springGrad)" stroke="#ffffff" stroke-width="1.5" filter="url(#glowCyan)"/>
        <!-- Tooth with 45 deg ramp -->
        <polygon points="22,10 32,25 22,25" fill="#fde047" stroke="#ca8a04" stroke-width="1"/>
        <text x="11" y="55" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="900" text-anchor="middle" transform="rotate(-90 11 55)">FREE BEAM</text>
        
        <!-- Bending Motion Arc -->
        <path d="M -6 15 C -20 15, -20 40, -6 40" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="3,3"/>
        <polygon points="-5,15 -14,11 -14,19" fill="#f43f5e"/>
        <text x="-48" y="30" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="900">BENDS</text>
      </g>

      <!-- Insertion Arrow -->
      <g transform="translate(200, 20)">
        <line x1="0" y1="0" x2="0" y2="40" stroke="#00e5ff" stroke-width="3" stroke-linecap="round"/>
        <polygon points="0,48 -5,35 5,35" fill="#00e5ff"/>
        <text x="12" y="26" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="900">PRESS IN</text>
      </g>
    </g>

    <g transform="translate(20, 440)">
      <rect x="0" y="0" width="380" height="38" rx="6" fill="#182030" stroke="#334155" stroke-width="1"/>
      <text x="190" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="middle">✨ Beam tip is completely free at the top to flex effortlessly</text>
    </g>
  </g>
</svg>
