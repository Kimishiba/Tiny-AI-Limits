<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" width="100%" height="100%">
  <defs>
    <!-- Gradients & Shadows -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14171f"/>
      <stop offset="100%" stop-color="#0d0f14"/>
    </linearGradient>
    
    <linearGradient id="espPcb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="displayPcb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <linearGradient id="goldPin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#ef4444" flood-opacity="0.8"/>
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#00d2d3" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="940" height="600" rx="16" fill="url(#bgGrad)" stroke="#262b36" stroke-width="2"/>
  
  <!-- Subtle Grid Dots Pattern -->
  <g opacity="0.15">
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94a3b8"/>
    </pattern>
    <rect width="940" height="600" fill="url(#grid)"/>
  </g>

  <!-- Title & Header Badge -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="130" height="26" rx="6" fill="#FF5F1F" filter="url(#shadow)"/>
    <text x="65" y="17" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1">SPI HARDWARE</text>
    
    <text x="145" y="19" fill="#ffffff" font-family="'Anybody', sans-serif" font-size="20" font-weight="900" letter-spacing="-0.5">GC9A01 1.28" ROUND IPS → ESP32-C3 SUPERMINI</text>
    <text x="0" y="44" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">High-speed hardware SPI pin mapping with backlight control</text>
  </g>

  <!-- ======================================================== -->
  <!-- 1. ESP32-C3 SUPERMINI BOARD (LEFT SIDE)                  -->
  <!-- ======================================================== -->
  <g transform="translate(60, 110)" filter="url(#shadow)">
    <!-- Board PCB -->
    <rect x="0" y="0" width="190" height="420" rx="12" fill="url(#espPcb)" stroke="#4338ca" stroke-width="2"/>

    <!-- Silk Branding -->
    <text x="95" y="72" fill="#ffffff" opacity="0.9" font-family="'Anybody', sans-serif" font-size="12" font-weight="900" text-anchor="middle">ESP32-C3</text>
    <text x="95" y="86" fill="#a5b4fc" opacity="0.8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">SUPERMINI</text>

    <!-- USB-C Receptacle (Top) -->
    <rect x="60" y="-12" width="70" height="28" rx="6" fill="url(#metal)" stroke="#334155" stroke-width="1.5"/>
    <rect x="72" y="-4" width="46" height="12" rx="3" fill="#0f172a"/>
    <text x="95" y="5" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">USB-C</text>

    <!-- SoC Chip (Center) -->
    <rect x="45" y="180" width="100" height="100" rx="6" fill="#090d16" stroke="#334155" stroke-width="1.5"/>
    <rect x="52" y="187" width="86" height="86" rx="4" fill="#121826"/>
    <!-- Chip Markings -->
    <circle cx="62" cy="197" r="2.5" fill="#ca8a04"/>
    <text x="95" y="226" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="middle">ESPRESSIF</text>
    <text x="95" y="240" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">ESP32-C3FN4</text>
    <text x="95" y="254" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">RISC-V 160MHz</text>

    <!-- Antenna & Status LED -->
    <path d="M 40 115 L 60 115 L 60 135 L 80 135 L 80 115 L 100 115 L 100 135 L 120 135 L 120 115 L 140 115" fill="none" stroke="#ca8a04" stroke-width="2"/>
    <circle cx="150" cy="115" r="3" fill="#10b981" filter="url(#shadow)"/>
    <text x="150" y="105" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">PWR</text>

    <!-- Buttons -->
    <rect x="25" y="320" width="20" height="24" rx="3" fill="#334155"/>
    <circle cx="35" cy="332" r="5" fill="#e2e8f0"/>
    <text x="35" y="354" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">BOOT</text>

    <rect x="145" y="320" width="20" height="24" rx="3" fill="#334155"/>
    <circle cx="155" cy="332" r="5" fill="#e2e8f0"/>
    <text x="155" y="354" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">RST</text>

    <!-- ==================== LEFT HEADER PINS ==================== -->
    <!-- Pin 1: 5V -->
    <circle cx="15" cy="40" r="7" fill="url(#goldPin)" stroke="#78350f" stroke-width="1"/>
    <text x="28" y="44" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">5V</text>

    <!-- Pin 2: GND (Connected) -->
    <circle id="pin_esp_gnd" cx="15" cy="80" r="7" fill="#000000" stroke="#94a3b8" stroke-width="2"/>
    <text x="28" y="84" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800">GND [2]</text>

    <!-- Pin 3: 3V3 (Connected) -->
    <circle id="pin_esp_3v3" cx="15" cy="120" r="7" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
    <text x="28" y="124" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800">3V3 [3]</text>

    <!-- Pin 4: GPIO 0 (BLK) -->
    <circle id="pin_esp_io0" cx="15" cy="160" r="7" fill="#ec4899" stroke="#ffffff" stroke-width="2"/>
    <text x="28" y="164" fill="#f472b6" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800">IO0 (BLK) [4]</text>

    <!-- Pin 5: GPIO 1 (RST) -->
    <circle id="pin_esp_io1" cx="15" cy="200" r="7" fill="#f97316" stroke="#ffffff" stroke-width="2"/>
    <text x="28" y="204" fill="#fb923c" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800">IO1 (RST) [5]</text>

    <!-- Pin 6: GPIO 2 -->
    <circle cx="15" cy="240" r="7" fill="url(#goldPin)"/>
    <text x="28" y="244" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">IO2 [6]</text>

    <!-- Pin 7: GPIO 3 -->
    <circle cx="15" cy="280" r="7" fill="url(#goldPin)"/>
    <text x="28" y="284" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">IO3 [7]</text>

    <!-- Pin 8: GPIO 4 (SCK / SCL) -->
    <circle id="pin_esp_io4" cx="15" cy="320" r="7" fill="#eab308" stroke="#ffffff" stroke-width="2"/>
    <text x="28" y="324" fill="#facc15" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800">IO4 (SCK) [8]</text>

    <!-- Pin 9: GPIO 5 (CS) -->
    <circle id="pin_esp_io5" cx="15" cy="360" r="7" fill="#a855f7" stroke="#ffffff" stroke-width="2"/>
    <text x="28" y="364" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800">IO5 (CS) [9]</text>

    <!-- ==================== RIGHT HEADER PINS ==================== -->
    <!-- Pin 16: GPIO 6 (MOSI / SDA) -->
    <circle id="pin_esp_io6" cx="175" cy="40" r="7" fill="#06b6d4" stroke="#ffffff" stroke-width="2"/>
    <text x="162" y="44" fill="#22d3ee" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="end">IO6 (MOSI) [16]</text>

    <!-- Pin 15: GPIO 7 (DC) -->
    <circle id="pin_esp_io7" cx="175" cy="80" r="7" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
    <text x="162" y="84" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="end">IO7 (DC) [15]</text>

    <!-- Pin 14: GPIO 8 -->
    <circle cx="175" cy="120" r="7" fill="url(#goldPin)"/>
    <text x="162" y="124" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="end">IO8 [14]</text>

    <!-- Pin 13: GPIO 9 -->
    <circle cx="175" cy="160" r="7" fill="url(#goldPin)"/>
    <text x="162" y="164" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="end">IO9 [13]</text>

    <!-- Pin 12: GPIO 10 -->
    <circle cx="175" cy="200" r="7" fill="url(#goldPin)"/>
    <text x="162" y="204" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="end">IO10 [12]</text>

    <!-- Pin 11: GPIO 20 (RX) -->
    <circle cx="175" cy="240" r="7" fill="url(#goldPin)"/>
    <text x="162" y="244" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="end">IO20/RX [11]</text>

    <!-- Pin 10: GPIO 21 (TX) -->
    <circle cx="175" cy="280" r="7" fill="url(#goldPin)"/>
    <text x="162" y="284" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="end">IO21/TX [10]</text>

    <!-- Pin 9 (Right GND) -->
    <circle cx="175" cy="320" r="7" fill="url(#goldPin)"/>
    <text x="162" y="324" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="end">GND [9]</text>

    <!-- Pin 8 (Right 5V) -->
    <circle cx="175" cy="360" r="7" fill="url(#goldPin)"/>
    <text x="162" y="364" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="end">5V [8]</text>
  </g>

  <!-- ======================================================== -->
  <!-- 2. GC9A01 1.28" CIRCULAR DISPLAY (CENTER / RIGHT)        -->
  <!-- ======================================================== -->
  <g transform="translate(560, 110)" filter="url(#shadow)">
    <!-- Round Display Board Background -->
    <circle cx="130" cy="180" r="128" fill="url(#displayPcb)" stroke="#334155" stroke-width="2"/>
    <circle cx="130" cy="180" r="114" fill="#000000" stroke="#00d2d3" stroke-width="2"/>

    <!-- Screen Glass Graphics Mock -->
    <circle cx="130" cy="180" r="106" fill="#0a0c10"/>
    
    <!-- Gauges & Clock Art -->
    <path d="M 50 180 A 80 80 0 0 1 130 100" fill="none" stroke="#00d2d3" stroke-width="6" stroke-linecap="round"/>
    <path d="M 210 180 A 80 80 0 0 0 130 100" fill="none" stroke="#FF5F1F" stroke-width="6" stroke-linecap="round"/>

    <!-- Clock Numbers -->
    <rect x="94" y="140" width="32" height="36" rx="4" fill="#1e2330" stroke="#384156"/>
    <rect x="134" y="140" width="32" height="36" rx="4" fill="#1e2330" stroke="#384156"/>
    <text x="110" y="165" fill="#ffffff" font-family="'Anybody', sans-serif" font-size="20" font-weight="900" text-anchor="middle">1</text>
    <text x="150" y="165" fill="#ffffff" font-family="'Anybody', sans-serif" font-size="20" font-weight="900" text-anchor="middle">2</text>
    <rect x="94" y="182" width="32" height="36" rx="4" fill="#1e2330" stroke="#384156"/>
    <rect x="134" y="182" width="32" height="36" rx="4" fill="#1e2330" stroke="#384156"/>
    <text x="110" y="207" fill="#ffffff" font-family="'Anybody', sans-serif" font-size="20" font-weight="900" text-anchor="middle">4</text>
    <text x="150" y="207" fill="#ffffff" font-family="'Anybody', sans-serif" font-size="20" font-weight="900" text-anchor="middle">5</text>

    <text x="130" y="125" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" text-anchor="middle">☀️ CLEAR • 23.5°C</text>
    <text x="130" y="235" fill="#00d2d3" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" text-anchor="middle">CLD 68% | AGY 42%</text>

    <!-- 8-Pin Header Block (Top/Side Connector) -->
    <rect x="10" y="325" width="240" height="90" rx="8" fill="#181c24" stroke="#334155" stroke-width="1.5"/>
    <text x="130" y="344" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="middle">GC9A01 8-PIN SPI HEADER</text>

    <!-- Display Pin Pads (8 Pins Left-to-Right) -->
    <!-- Pin 1: VCC -->
    <g transform="translate(25, 370)">
      <circle id="disp_vcc" cx="0" cy="0" r="7" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="24" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" text-anchor="middle">VCC</text>
    </g>

    <!-- Pin 2: GND -->
    <g transform="translate(56, 370)">
      <circle id="disp_gnd" cx="0" cy="0" r="7" fill="#000000" stroke="#94a3b8" stroke-width="2"/>
      <text x="0" y="24" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" text-anchor="middle">GND</text>
    </g>

    <!-- Pin 3: SCL -->
    <g transform="translate(87, 370)">
      <circle id="disp_scl" cx="0" cy="0" r="7" fill="#eab308" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="24" fill="#facc15" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" text-anchor="middle">SCL</text>
    </g>

    <!-- Pin 4: SDA -->
    <g transform="translate(118, 370)">
      <circle id="disp_sda" cx="0" cy="0" r="7" fill="#06b6d4" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="24" fill="#22d3ee" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" text-anchor="middle">SDA</text>
    </g>

    <!-- Pin 5: DC -->
    <g transform="translate(149, 370)">
      <circle id="disp_dc" cx="0" cy="0" r="7" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="24" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" text-anchor="middle">DC</text>
    </g>

    <!-- Pin 6: CS -->
    <g transform="translate(180, 370)">
      <circle id="disp_cs" cx="0" cy="0" r="7" fill="#a855f7" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="24" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" text-anchor="middle">CS</text>
    </g>

    <!-- Pin 7: RST -->
    <g transform="translate(211, 370)">
      <circle id="disp_rst" cx="0" cy="0" r="7" fill="#f97316" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="24" fill="#fb923c" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" text-anchor="middle">RST</text>
    </g>

    <!-- Pin 8: BLK -->
    <g transform="translate(236, 370)">
      <circle id="disp_blk" cx="0" cy="0" r="7" fill="#ec4899" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="24" fill="#f472b6" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" text-anchor="middle">BLK</text>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- 3. COLOR-CODED JUMPER WIRES (CURVED BEZIERS)             -->
  <!-- ======================================================== -->
  <!-- Wire 1: 3.3V Power (RED) -> ESP Pin 3 [75, 230] to Disp VCC [585, 480] -->
  <path d="M 75 230 C 150 210, 420 540, 585 480" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round" opacity="0.95"/>

  <!-- Wire 2: Ground (BLACK/SLATE) -> ESP Pin 2 [75, 190] to Disp GND [616, 480] -->
  <path d="M 75 190 C 160 170, 430 520, 616 480" fill="none" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
  <path d="M 75 190 C 160 170, 430 520, 616 480" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>

  <!-- Wire 3: SCL / SCK (YELLOW) -> ESP Pin 8 [75, 430] to Disp SCL [647, 480] -->
  <path d="M 75 430 C 220 440, 480 500, 647 480" fill="none" stroke="#eab308" stroke-width="3.5" stroke-linecap="round" opacity="0.95"/>

  <!-- Wire 4: SDA / MOSI (CYAN) -> ESP Pin 16 [235, 150] to Disp SDA [678, 480] -->
  <path d="M 235 150 C 360 120, 520 420, 678 480" fill="none" stroke="#06b6d4" stroke-width="3.5" stroke-linecap="round" opacity="0.95"/>

  <!-- Wire 5: DC (GREEN) -> ESP Pin 15 [235, 190] to Disp DC [709, 480] -->
  <path d="M 235 190 C 370 180, 550 430, 709 480" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" opacity="0.95"/>

  <!-- Wire 6: CS (PURPLE) -> ESP Pin 9 [75, 470] to Disp CS [740, 480] -->
  <path d="M 75 470 C 260 520, 560 530, 740 480" fill="none" stroke="#a855f7" stroke-width="3.5" stroke-linecap="round" opacity="0.95"/>

  <!-- Wire 7: RST (ORANGE) -> ESP Pin 5 [75, 310] to Disp RST [771, 480] -->
  <path d="M 75 310 C 260 300, 580 440, 771 480" fill="none" stroke="#f97316" stroke-width="3.5" stroke-linecap="round" opacity="0.95"/>

  <!-- Wire 8: BLK (PINK) -> ESP Pin 4 [75, 270] to Disp BLK [796, 480] -->
  <path d="M 75 270 C 240 260, 600 420, 796 480" fill="none" stroke="#ec4899" stroke-width="3.5" stroke-linecap="round" opacity="0.95"/>

  <!-- ======================================================== -->
  <!-- 4. QUICK REFERENCE PINOUT SUMMARY TABLE (BOTTOM)         -->
  <!-- ======================================================== -->
  <g transform="translate(60, 545)">
    <rect x="0" y="0" width="820" height="42" rx="8" fill="#181c24" stroke="#334155" stroke-width="1"/>
    <text x="20" y="26" fill="#ffffff" font-family="'Anybody', sans-serif" font-size="11" font-weight="900">PIN SUMMARY:</text>
    
    <text x="130" y="26" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">● 3V3 → VCC</text>
    <text x="230" y="26" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">● GND → GND</text>
    <text x="330" y="26" fill="#facc15" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">● IO4 → SCL</text>
    <text x="430" y="26" fill="#22d3ee" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">● IO6 → SDA</text>
    <text x="530" y="26" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">● IO7 → DC</text>
    <text x="620" y="26" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">● IO5 → CS</text>
    <text x="710" y="26" fill="#fb923c" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">● IO1 → RST</text>
  </g>
</svg>
